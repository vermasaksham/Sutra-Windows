<!doctype html>
<html lang="en" data-theme="light" data-palette="sutra">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Sutra</title>
    <script>
      // Runs before first paint so the window never flashes the wrong colours.
      // Mirrors readPreference/readPalette/resolveTheme in src/theme/theme.ts —
      // keep the two in step. The palette list below is pinned to the one in
      // that module by a test (src/theme/theme.test.ts), which reads this file.
      (function () {
        try {
          var palettes = ["sutra", "indigo", "slate", "contrast"];
          var storedTheme = localStorage.getItem("sutra.theme");
          var pref =
            storedTheme === "light" ||
            storedTheme === "dark" ||
            storedTheme === "system"
              ? storedTheme
              : "system";
          var resolved =
            pref === "system"
              ? window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : pref;
          var storedPalette = localStorage.getItem("sutra.palette");
          document.documentElement.dataset.theme = resolved;
          document.documentElement.dataset.palette =
            palettes.indexOf(storedPalette) === -1 ? "sutra" : storedPalette;
        } catch (_) {
          document.documentElement.dataset.theme = "light";
          document.documentElement.dataset.palette = "sutra";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
